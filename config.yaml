  - { handle: pumpdotfun,      id: null, role: official, asset: PUMP }
  - { handle: SECGov,          id: null, role: official, asset: null }
  - { handle: CFTC,            id: null, role: official, asset: null }
  - { handle: binance,         id: null, role: official, asset: null }
  - { handle: coinbase,        id: null, role: official, asset: null }
  - { handle: VitalikButerin,  id: null, role: founder,  asset: ETH }
  - { handle: aeyakovenko,     id: null, role: founder,  asset: SOL }
  - { handle: StaniKulechov,   id: null, role: founder,  asset: AAVE }
  - { handle: saylor,          id: null, role: founder,  asset: BTC }
  - { handle: lookonchain,     id: null, role: data,     asset: null }
  - { handle: whale_alert,     id: null, role: data,     asset: null }
  - { handle: PeckShieldAlert, id: null, role: data,     asset: null }
  - { handle: zachxbt,         id: null, role: data,     asset: null }
